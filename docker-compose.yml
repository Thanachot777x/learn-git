services:
  web:
    image: php:8.2-apache
    container_name: it_support_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: it_support
      DB_USER: root
      DB_PASS: rootpass
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    command: >
      bash -c "docker-php-ext-install pdo pdo_mysql mysqli &&
               apache2-foreground"

  db:
    image: mysql:8.0
    container_name: it_support_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: it_support
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: it_support_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: rootpass

volumes:
  db_data: